<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9544" />
      <stop offset="50%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#C85408" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#logo-bg)" />
  <rect width="512" height="512" rx="128" fill="url(#glass)" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <!-- Play Button Triangle -->
  <path d="M190 148 V364 C190 376 203 384 214 377 L396 269 C406 263 406 249 396 243 L214 135 C203 128 190 136 190 148 Z" fill="#ffffff" filter="url(#drop-shadow)" />

  <!-- Acoustic Bars -->
  <rect x="420" y="226" width="22" height="60" rx="11" fill="#ffffff" opacity="0.65" />
  <rect x="454" y="196" width="22" height="120" rx="11" fill="#ffffff" opacity="0.85" />
</svg>
