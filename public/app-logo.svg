<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emblem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA843" />
      <stop offset="35%" stop-color="#F27D26" />
      <stop offset="75%" stop-color="#C44E04" />
      <stop offset="100%" stop-color="#701E00" />
    </linearGradient>
    <linearGradient id="glass-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#FFF2E5" />
    </linearGradient>
    <filter id="logo-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#emblem-bg)" />
  <rect width="512" height="512" rx="128" fill="url(#glass-reflect)" stroke="rgba(255,255,255,0.3)" stroke-width="8" />

  <!-- Concentric Vinyl Grooves -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Musical Note Stem and Arch -->
  <path d="M190 120 C190 108 200 98 212 98 H290 C302 98 312 108 312 120 V250" fill="none" stroke="url(#play-grad)" stroke-width="26" stroke-linecap="round" />
  <path d="M290 98 C335 98 400 125 425 185 C380 170 325 165 305 165" fill="none" stroke="url(#play-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Dynamic Playhead Triangle Fused with Musical Note -->
  <path d="M180 200 V375 C180 388 195 397 206 390 L345 303 C356 296 356 280 345 273 L206 185 C195 178 180 187 180 200 Z" fill="url(#play-grad)" filter="url(#logo-drop)" />

  <!-- Vinyl Center Spindle -->
  <circle cx="230" cy="288" r="18" fill="#F27D26" />
  <circle cx="230" cy="288" r="8" fill="#ffffff" />

  <!-- Audio Equalizer Waveform Bars on Right -->
  <rect x="430" y="270" width="16" height="60" rx="8" fill="#ffffff" opacity="0.75" />
  <rect x="456" y="230" width="16" height="110" rx="8" fill="#ffffff" opacity="0.95" />
</svg>
