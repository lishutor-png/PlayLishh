<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="playlish-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9544" />
      <stop offset="50%" stop-color="#F27D26" />
      <stop offset="100%" stop-color="#C85408" />
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <filter id="play-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with PlayLish Orange Gradient -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#playlish-grad)" />
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#glass-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Play Button Triangle -->
  <path d="M36 29 V71 C36 73.2 38.4 74.6 40.4 73.4 L74 52.4 C75.8 51.3 75.8 48.7 74 47.6 L40.4 26.6 C38.4 25.4 36 26.8 36 29 Z" fill="#ffffff" filter="url(#play-shadow)" />
  
  <!-- Acoustic Wave Accents on the right -->
  <rect x="79" y="44" width="4" height="12" rx="2" fill="#ffffff" opacity="0.6" />
  <rect x="85" y="38" width="4" height="24" rx="2" fill="#ffffff" opacity="0.8" />
</svg>
