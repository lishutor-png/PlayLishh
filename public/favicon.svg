<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA843" />
      <stop offset="35%" stop-color="#F27D26" />
      <stop offset="75%" stop-color="#C44E04" />
      <stop offset="100%" stop-color="#701E00" />
    </linearGradient>
    <linearGradient id="fav-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#fav-bg)" />
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#fav-glass)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Concentric Grooves -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" />

  <!-- Music Note Stem -->
  <path d="M37 24 C37 22 39 20 41 20 H56 C58 20 60 22 60 24 V50" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <path d="M56 20 C64 20 76 25 80 35 C72 32 63 31 59 31" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Playhead Fused with Note -->
  <path d="M35 39 V73 C35 75.3 37.5 76.7 39.5 75.5 L64 60.5 C65.8 59.4 65.8 56.8 64 55.7 L39.5 40.7 C37.5 39.5 35 40.9 35 43 Z" fill="#ffffff" filter="url(#fav-shadow)" />

  <!-- Center Spindle -->
  <circle cx="44" cy="58" r="3" fill="#F27D26" />

  <!-- Equalizer Accents -->
  <rect x="83" y="52" width="3" height="12" rx="1.5" fill="#ffffff" opacity="0.8" />
  <rect x="88" y="44" width="3" height="22" rx="1.5" fill="#ffffff" opacity="0.95" />
</svg>
